[flake8]
# Правило P2: длинные строки (>80 символов)
max-line-length = 79

# Правило P2: цикломатическая сложность (порог B = 6-10)
max-complexity = 10

# Исключение тестов, окружений, кэша
exclude =
    .git,
    __pycache__,
    .venv,
    venv,S
    tests

# Игнорируемые ошибки (конфликты с Black)
ignore =
    E203,
    W503

# Правило P3 и P4: функция не длиннее 40 строк, не больше 7 аргументов
# (плагин flake8-functions, коды CFQ001 и CFQ002)
extend-select = CFQ